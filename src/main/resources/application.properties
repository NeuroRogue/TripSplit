# Spring Boot Main Configuration
spring.application.name=TripSplit
server.port=8080

# Default profile is MySQL as required by TripSplit project guide
# Switch to 'h2' anytime for offline in-memory demo if MySQL service is unavailable:
# spring.profiles.active=h2
spring.profiles.active=mysql

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload / multipart settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

