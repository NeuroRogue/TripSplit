# MySQL Configuration for TripSplit
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tripsplit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' automatically ensures missing tables/columns exist without dropping existing tables;
# Change to 'validate' if strictly enforcing pre-existing schema as per project PDF instructions.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
